<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="196" viewBox="0 0 1120 196" role="img" aria-labelledby="title desc">
  <title id="title">Research loop</title>
  <desc id="desc">Establish a baseline, test it on held-out data, and study the errors. Animated pulses trace the cycle.</desc>
  <defs>
    <linearGradient id="background">
      <stop stop-color="#17162b"/>
      <stop offset=".5" stop-color="#111524"/>
      <stop offset="1" stop-color="#161d20"/>
    </linearGradient>
    <linearGradient id="flow">
      <stop stop-color="#a58bff"/>
      <stop offset=".5" stop-color="#95a6ff"/>
      <stop offset="1" stop-color="#d7f894"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#575977"/>
    </pattern>
    <style>
      .steps { stroke-dasharray: 2 11; animation: flow 2s linear infinite; }
      .return { stroke-dasharray: 3 9; animation: flow 3s linear infinite reverse; }
      .node { animation: pulse 4.8s ease-in-out infinite; }
      .middle { animation-delay: 1.6s; }
      .last { animation-delay: 3.2s; }
      @keyframes flow { to { stroke-dashoffset: -78; } }
      @keyframes pulse { 0%,20%,100% { opacity: .35; } 10% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .steps, .return, .node { animation: none; }
        .spark { display: none; }
      }
    </style>
  </defs>
  <rect x=".75" y=".75" width="1118.5" height="194.5" rx="21" fill="url(#background)" stroke="#50536f" stroke-width="1.5"/>
  <rect x="12" y="12" width="1096" height="172" rx="15" fill="url(#dots)" opacity=".25"/>
  <g fill="none" stroke-width="2">
    <path d="M195 62H925" stroke="#49455f"/>
    <path class="steps" d="M195 62H925" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
    <path class="return" d="M925 137v5a19 19 0 0 1-19 19H214a19 19 0 0 1-19-19v-5" stroke="#8383a4" stroke-linecap="round"/>
    <path d="m190 142 5-6 5 6" stroke="#9d90bc" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle class="spark" cx="0" cy="0" r="4" fill="#e7ffae">
    <animateMotion path="M195 62H925" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <g stroke-width="2">
    <circle class="node" cx="195" cy="62" r="19" fill="#342651" stroke="#ad91ff"/>
    <circle class="node middle" cx="560" cy="62" r="19" fill="#263252" stroke="#a6b4ff"/>
    <circle class="node last" cx="925" cy="62" r="19" fill="#35442c" stroke="#d7f894"/>
  </g>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M187 68h16m-14-5 4-4 4 2 4-6" stroke="#cbbaff"/>
    <path d="M554 62l4 4 8-8" stroke="#c2cbff"/>
    <path d="M932 60a7 7 0 1 0-.5 5m.5-10v5h-5" stroke="#d7f894"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="28" font-weight="650" fill="#f4f1ff">
    <text x="195" y="119">Build a baseline</text>
    <text x="560" y="119">Test on held-out data</text>
    <text x="925" y="119">Study the errors</text>
  </g>
</svg>
